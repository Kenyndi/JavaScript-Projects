<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Expressions and Alerts</title>
</head>
<body>
  <script>
    // Store the beginning and ending parts of the sentence.
    var Sent1 = "This is the beginning of the string";
    var Sent2 = " and this is the end of the string";

    // Concatenate the strings and store the result.
    var fullSentence = Sent1 + Sent2;

    // Create an expression and store its result.
    var expressionResult = 3 + 4;

    // Display the sentence in an alert and write both results to the page.
    window.alert(fullSentence);
    document.write(fullSentence + "<br>Expression result: " + expressionResult);
  </script>
</body>
</html>
